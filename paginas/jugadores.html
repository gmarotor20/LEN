<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset='utf-8'>
    <title>FAZE CLAN JOKALARIAK</title>
    <link rel="stylesheet" href="../css/jugadores.css">
</head>

<body>
    <header>
        <h1>FAZE CLAN JOKALARIAK</h1>
    </header>
    
    <section class="equipos-container">
        <h2>Jugadores de FAZE CLAN</h2>

        <div id="j1" class="equipo-card">
            <a href="https://liquipedia.net/counterstrike/Karrigan" target="_blank">
                <img src="../img/equipos/jugadores/j3.png" alt="Jugador Karrigan de FAZE CLAN" class="imagen-jugador">
            </a>
            <p class="nombre-equipo">
                Karrigan <img src="../img/equipos/banderas/dinamarca.png" class="dinamarca" alt="Bandera de Dinamarca">
            </p>
        </div>

        <div class="equipo-card" id="j2">
            <a href="https://liquipedia.net/counterstrike/Twistzz" target="_blank">
                <img src="../img/equipos/jugadores/j1.png" alt="Jugador Twistzz de FAZE CLAN" class="imagen-jugador">
            </a>
            <p class="nombre-equipo">
                Twistzz <img src="../img/equipos/banderas/canada.png" class="canada" alt="Bandera de Canadá">
            </p>
        </div>

        <div class="equipo-card" id="j3">
            <img src="../img/equipos/jugadores/j2.png" alt="Jugador Philip de FAZE CLAN" class="imagen-jugador">
            <p class="nombre-equipo">
                Philip <img src="../img/equipos/banderas/reino_unido.png" class="reinounido" alt="Bandera del Reino Unido">
            </p>
        </div>

    </section>

</body>
</html>
